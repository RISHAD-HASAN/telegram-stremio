name: Tests

on:
  push:
  pull_request:
  schedule:
    # Mondays 05:00 UTC: new advisories show up even when nothing was pushed.
    - cron: "0 5 * * 1"

# The workflow only reads the repository. It has no secrets and needs none.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      # Actions are pinned to a commit; the comment names the release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q Backend tools tests update.py season2mpv.py bump-version.py
      - name: Run tests
        run: python -m pytest -q

  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1
      - name: Check pinned dependencies for published advisories
        # CVE-2025-67720 (pyrofork download_media to disk) is accepted: every
        # download in this project is in memory. See SECURITY.md.
        run: pip-audit -r requirements.txt --progress-spinner off --ignore-vuln CVE-2025-67720
